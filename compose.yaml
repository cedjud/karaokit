# Local stack: worker at http://localhost:8000 (files in ./data, served at /media), web UI at http://localhost:8080.
# Web only: npm run dev:local (Vite dev server against the worker).
services:
  worker:
    build: worker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_TOKEN: local
  web:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MEDIA_URL: http://localhost:8000/media
        VITE_API_TOKEN: local
    ports:
      - "8080:80"
